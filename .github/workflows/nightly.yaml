---
name: Nightly

# yamllint disable-line rule:truthy
on:
  schedule:
    # 07:00 UTC — early morning US Eastern
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/hassio-addons/app-vaultwarden.git

jobs:
  nightly:
    name: Sync, bump and verify
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔧 Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ----------------------------------------------------------------------
      # Merge upstream. Everything under .github/ is ours by construction — our
      # CI replaced upstream's org-specific workflows — so conflicts there
      # resolve to our side automatically, and workflows upstream adds get
      # dropped (we do not run them, and GITHUB_TOKEN cannot push them anyway).
      # Conflicts elsewhere — realistically the Dockerfile, where upstream keeps
      # re-pinning the apt packages we deliberately unpinned — also resolve to
      # our side, but go to a PR so a human confirms nothing was lost.
      # ----------------------------------------------------------------------
      - name: ⬇️ Merge upstream
        id: sync
        run: |
          git remote add upstream "${UPSTREAM}"
          git fetch --quiet upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."
            echo "glue_changed=false" >>"$GITHUB_OUTPUT"
            echo "conflict=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          before=$(git rev-parse HEAD)
          conflict=false

          # Take our file verbatim under ${1}: our CI is a rewrite, not a
          # variant, so upstream's version of it is never wanted.
          keep_our_files() {
            local f
            for f in $(git diff --name-only --diff-filter=U -- "$1"); do
              if git cat-file -e "${before}:${f}" 2>/dev/null; then
                echo "Keeping our ${f}"
                git checkout --ours -- "${f}"
                git add -- "${f}"
              else
                echo "Keeping our deletion of ${f}"
                git rm -q -f -- "${f}"
              fi
            done
          }

          # Elsewhere, resolve per hunk: our side wins where the two sides
          # clash, but upstream's untouched changes to the same file survive.
          keep_our_hunks() {
            local f tmp
            tmp=$(mktemp -d)
            for f in $(git diff --name-only --diff-filter=U); do
              if ! git cat-file -e "${before}:${f}" 2>/dev/null; then
                echo "Keeping our deletion of ${f}"
                git rm -q -f -- "${f}"
              elif git show ":1:${f}" >"${tmp}/base" 2>/dev/null \
                && git show ":3:${f}" >"${tmp}/theirs" 2>/dev/null; then
                echo "Keeping our side of the conflicting hunks in ${f}"
                git show ":2:${f}" >"${tmp}/ours"
                git merge-file -q -p --ours \
                  "${tmp}/ours" "${tmp}/base" "${tmp}/theirs" >"${f}" || true
                git add -- "${f}"
              else
                echo "Keeping our ${f}"
                git checkout --ours -- "${f}"
                git add -- "${f}"
              fi
            done
            rm -rf "${tmp}"
          }

          if ! git merge --no-edit upstream/main; then
            keep_our_files .github

            remaining=$(git diff --name-only --diff-filter=U)
            if [[ -n "${remaining}" ]]; then
              echo "::warning::Kept our side of conflicting files, sending them to a PR:"
              echo "${remaining}"
              conflict=true
              keep_our_hunks
              {
                echo "conflicts<<CONFLICTS_EOF"
                echo "${remaining}"
                echo "CONFLICTS_EOF"
              } >>"$GITHUB_OUTPUT"
            fi

            git commit --no-edit
          fi

          added=$(git diff --name-only --diff-filter=A "${before}" HEAD -- .github)
          if [[ -n "${added}" ]]; then
            echo "Dropping upstream workflows we do not run:"
            echo "${added}"
            # shellcheck disable=SC2086
            git rm -q -f -- ${added}
            git commit -q -m "🧹 Drop upstream .github files we do not use"
          fi

          after=$(git rev-parse HEAD)
          [[ "${before}" != "${after}" ]] && changed=true || changed=false
          echo "glue_changed=${changed}" >>"$GITHUB_OUTPUT"
          echo "conflict=${conflict}" >>"$GITHUB_OUTPUT"

      # ----------------------------------------------------------------------
      # Push the resolved merge — not upstream/main itself, which carries their
      # workflow files that GITHUB_TOKEN is forbidden from writing. If a sync PR
      # is already open, leave it alone: a human may be resolving it in place.
      # ----------------------------------------------------------------------
      - name: 🔀 Open a sync PR for review
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFLICTS: ${{ steps.sync.outputs.conflicts }}
        run: |
          if [[ -n "$(gh pr list --head upstream-sync --state open --json number --jq '.[].number')" ]]; then
            echo "Sync PR already open; leaving it for a human."
            exit 0
          fi

          body=$(
            echo "The nightly merge of \`hassio-addons/app-vaultwarden@main\` hit conflicts in:"
            echo ""
            while read -r f; do [[ -n "${f}" ]] && echo "- \`${f}\`"; done <<<"${CONFLICTS}"
            echo ""
            echo "Our side was kept, so this branch is mergeable as-is — but check the"
            echo "diff for anything upstream changed that we actually want. Usually this"
            echo "is the Dockerfile, where upstream re-pins the apt packages we unpinned"
            echo "on purpose."
          )

          if ! git push --force origin HEAD:refs/heads/upstream-sync; then
            title="🔀 Upstream needs a manual merge"
            existing=$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number')
            issue_body=$(printf '%s\n\n```sh\ngit fetch upstream && git merge upstream/main\n```\n\n%s\n' \
              'Could not push the resolved merge, so no PR was opened. Merge it locally:' "${body}")
            if [[ -n "${existing}" ]]; then
              gh issue comment "${existing}" --body "${issue_body}"
            else
              gh issue create --title "${title}" --body "${issue_body}"
            fi
            exit 1
          fi

          gh pr create --head upstream-sync --base main \
            --title "⬆️ Merge upstream changes (review needed)" \
            --body "${body}"

      - name: ⬆️ Check for a new Vaultwarden release
        if: steps.sync.outputs.conflict != 'true'
        id: bump
        run: |
          chmod +x .github/scripts/update-version.sh
          if [[ "${{ steps.sync.outputs.glue_changed }}" == "true" ]]; then
            .github/scripts/update-version.sh --glue-changed
          else
            .github/scripts/update-version.sh
          fi

      # ----------------------------------------------------------------------
      # Always build — both arches, every night. The Debian packages are
      # unpinned, so this is what catches mirror drift before the HA box does.
      # ----------------------------------------------------------------------
      - name: 🏗️ Set up QEMU
        if: steps.sync.outputs.conflict != 'true'
        uses: docker/setup-qemu-action@v4

      - name: 🏗️ Set up Buildx
        if: steps.sync.outputs.conflict != 'true'
        uses: docker/setup-buildx-action@v4

      - name: 🧪 Build for amd64 and aarch64
        if: steps.sync.outputs.conflict != 'true'
        id: build
        run: |
          base=$(sed -nE 's/^  amd64: (.+)$/\1/p' vaultwarden/build.yaml)
          echo "Base image: ${base}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg "BUILD_FROM=${base}" \
            --output type=cacheonly \
            --progress plain \
            vaultwarden

      - name: 🚀 Commit, tag and push
        if: steps.sync.outputs.conflict != 'true' && steps.bump.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "⬆️ Vaultwarden ${{ steps.bump.outputs.vw_latest }} (add-on v${{ steps.bump.outputs.addon_new }})"
          git tag "v${{ steps.bump.outputs.addon_new }}"
          git push origin main
          git push origin "v${{ steps.bump.outputs.addon_new }}"

      - name: 📤 Push upstream-only changes
        if: steps.sync.outputs.conflict != 'true' && steps.bump.outputs.changed != 'true' && steps.sync.outputs.glue_changed == 'true'
        run: git push origin main

      - name: 🚨 Report a broken build
        if: failure() && steps.build.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="🚨 Nightly build failed"
          existing=$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number')
          body="The nightly build failed, so nothing was pushed — the add-on is still on the last known-good version. [Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          if [[ -n "${existing}" ]]; then
            gh issue comment "${existing}" --body "${body}"
          else
            gh issue create --title "${title}" --body "${body}"
          fi

      - name: 📋 Summary
        if: always()
        run: |
          {
            if [[ "${{ steps.sync.outputs.conflict }}" == "true" ]]; then
              echo "## 🔀 Upstream merge needs review"
            elif [[ "${{ steps.bump.outputs.changed }}" == "true" ]]; then
              echo "## ✅ Shipped add-on v${{ steps.bump.outputs.addon_new }}"
              echo ""
              echo "**Vaultwarden:** ${{ steps.bump.outputs.vw_current }} → ${{ steps.bump.outputs.vw_latest }}"
            elif [[ "${{ steps.sync.outputs.glue_changed }}" == "true" ]]; then
              echo "## ✅ Merged upstream changes (no version bump)"
            else
              echo "## ℹ️ Nothing to do"
              echo ""
              echo "Vaultwarden ${{ steps.bump.outputs.vw_current }} is current; build verified."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
